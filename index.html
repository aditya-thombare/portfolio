<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aditya Thombare | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
            text-align: center;
        }

        .container {
            max-width: 650px;
            padding: 40px 25px;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .message {
            font-size: 20px;
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .coming-soon {
            display: inline-block;
            padding: 12px 25px;
            border-radius: 30px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .footer {
            margin-top: 50px;
            font-size: 14px;
            color: #9ca3af;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🚀</div>

        <h1>Thank You for Visiting!</h1>

        <p class="message">
            My portfolio is currently being updated and will be available soon.
			<br><br>
			In the meantime, thank you for your interest, and I look forward to connecting with you.
        </p>

        <div class="coming-soon">
            Portfolio Coming Soon
        </div>

        <div class="footer">
            © 2026 Aditya Thombare
        </div>

    </div>

</body>
</html>
